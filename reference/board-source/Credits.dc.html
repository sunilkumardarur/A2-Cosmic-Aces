<helmet>

  <div style="position: absolute; left: 110px; top: 440px; width: 220px; text-align: center; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 22px; letter-spacing: 3px; color: #2DE2FF">AYAN</div>

  <svg role="img" aria-label="Aarav" viewBox="0 0 120 120" style="position: absolute; right: 110px; top: 200px; width: 220px; height: 220px"><circle cx="60" cy="60" r="56" fill="#1E140C"/><circle cx="60" cy="64" r="44" fill="#2A1C12" stroke="#FF9A3D" stroke-width="4"/><rect x="12" y="56" width="10" height="26" rx="4" fill="#FF9A3D"/><rect x="98" y="56" width="10" height="26" rx="4" fill="#FF9A3D"/><ellipse cx="60" cy="74" rx="27" ry="28" fill="#A86A42"/><path d="M33 68 Q36 48 60 46 Q84 46 87 64 Q72 56 52 58 Q42 60 33 68 Z" fill="#14100E"/><circle cx="49" cy="77" r="8" fill="none" stroke="#FFC83D" stroke-width="2.5"/><circle cx="71" cy="77" r="8" fill="none" stroke="#FFC83D" stroke-width="2.5"/><path d="M57 77 L63 77" stroke="#FFC83D" stroke-width="2.5"/><circle cx="49" cy="77" r="3.5" fill="#14100E"/><circle cx="71" cy="77" r="3.5" fill="#14100E"/><path d="M50 90 Q60 96 70 90" stroke="#14100E" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="34" y="22" width="52" height="16" rx="8" fill="#FF9A3D"/></svg>

  <div style="position: absolute; left: 400px; right: 400px; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center">
    <div style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 40px; letter-spacing: 5px; text-shadow: 0 0 20px rgba(45,226,255,.6)">A<span style="font-size: 24px; vertical-align: top; color: #FF3EA5">2</span> COSMIC ACES</div>
    <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; letter-spacing: 5px; color: #A9B4D0">GAME DESIGN</span><span style="font-size: 20px; font-weight: 600">[YOUR NAME]</span></div>
    <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; letter-spacing: 5px; color: #A9B4D0">ART &amp; ANIMATION</span><span style="font-size: 20px; font-weight: 600">[YOUR NAME]</span></div>

    <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; letter-spacing: 5px; color: #FFC83D">SPECIAL THANKS</span><span style="font-size: 20px; font-weight: 600">[FAMILY &amp; PLAYTESTERS]</span></div>
    <div style="font-size: 13px; color: #A9B4D0; margin-top: 4px">Thanks for playing. Two pilots, one mission.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    let s = 47;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const stars = [];
    for (let i = 0; i < 100; i++) stars.push({ x: Math.round(r() * 1280), y: Math.round(r() * 720), o: (0.15 + r() * 0.55).toFixed(2) });
    return { stars };
  }
}
</script>
</body>
</html>
