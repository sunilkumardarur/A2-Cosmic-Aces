<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A² Cosmic Aces — Game Over</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Exo+2:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2DE2FF}a:hover{color:#FFFFFF}
.gb:hover{filter:brightness(1.25)}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #0A0408; font-family: 'Exo 2', sans-serif; color: #FFFFFF">
  <sc-for list="{{stars}}" as="s" hint-placeholder-count="20">
    <div style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: 2px; height: 2px; border-radius: 50%; background: #FFD6DC; opacity: {{s.o}}"></div>
  </sc-for>
  <div style="position: absolute; left: 240px; top: 80px; width: 800px; height: 600px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,77,94,.20), rgba(10,4,8,0) 65%)"></div>

  <div style="position: absolute; left: 0; right: 0; top: 70px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center">
    <div style="font-size: 13px; letter-spacing: 8px; color: #FF7A86">STAGE 1 · EMBER BELT</div>
    <h1 style="margin: 0; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 76px; letter-spacing: 6px; color: #FF4D5E; text-shadow: 0 0 30px rgba(255,77,94,.7)">GAME OVER</h1>
    <div style="font-size: 18px; color: #E4C9CE">The Aces went down — but the galaxy still needs them.</div>
  </div>

  <svg role="img" aria-label="Crashing Nova Striker jet trailing smoke and fire" viewBox="0 0 200 200" style="position: absolute; left: 120px; top: 300px; width: 260px; height: 260px">
    <path d="M110 40 Q80 80 100 120 Q70 150 90 190" stroke="#3A2A30" stroke-width="22" fill="none" stroke-linecap="round" opacity=".7"/>
    <path d="M118 36 Q90 76 108 116" stroke="#FF9A3D" stroke-width="8" fill="none" stroke-linecap="round" opacity=".8"/>
    <g transform="translate(120 20) rotate(32) scale(0.9)"><path d="M50 4 L60 40 L92 74 L92 86 L62 80 L58 96 L42 96 L38 80 L8 86 L8 74 L40 40 Z" fill="#0E1A2E" stroke="#2DE2FF" stroke-width="3" stroke-linejoin="round"/><path d="M50 18 L55 44 L50 58 L45 44 Z" fill="#2DE2FF" opacity=".5"/><path d="M60 40 L52 52 L64 58 L56 70" stroke="#FF4D5E" stroke-width="3" fill="none"/></g>
    <path d="M150 60 L158 48 L162 62 L174 56 L166 70 L178 78 L164 80 Z" fill="#FFC83D"/>
  </svg>

  <div style="position: absolute; left: 420px; top: 290px; width: 440px; display: flex; flex-direction: column; gap: 10px; padding: 22px 26px; border: 2px solid rgba(255,77,94,.6); background: rgba(10,4,8,.8)">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 12px; letter-spacing: 3px; color: #E4C9CE">FINAL SCORE</span><b style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 34px">0012450</b></div>
    <div style="display: flex; justify-content: space-between"><span style="font-size: 13px; color: #E4C9CE">BEST SCORE</span><b style="font-family: 'Orbitron', sans-serif; font-size: 15px; color: #FFC83D">0031820</b></div>
    <div style="height: 1px; background: rgba(255,255,255,.15)"></div>
    <div style="display: flex; justify-content: space-between"><span style="font-size: 13px; color: #E4C9CE">ENEMIES DESTROYED</span><b>42</b></div>
    <div style="display: flex; justify-content: space-between"><span style="font-size: 13px; color: #E4C9CE">ACCURACY</span><b>68%</b></div>
    <div style="display: flex; justify-content: space-between"><span style="font-size: 13px; color: #E4C9CE">LONGEST COMBO</span><b>×6</b></div>
    <div style="display: flex; justify-content: space-between"><span style="font-size: 13px; color: #E4C9CE">CREDITS KEPT (GOLD COINS ONLY)</span><b style="color: #FFC83D">+6</b></div>
  </div>

  <div style="position: absolute; right: 140px; top: 300px; width: 240px; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <div style="font-size: 12px; letter-spacing: 4px; color: #E4C9CE">CONTINUE?</div>
    <div style="position: relative; width: 150px; height: 150px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" viewBox="0 0 150 150" style="position: absolute; inset: 0; width: 150px; height: 150px"><circle cx="75" cy="75" r="66" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="8"/><circle cx="75" cy="75" r="66" fill="none" stroke="#FF3EA5" stroke-width="8" stroke-linecap="round" stroke-dasharray="415" stroke-dashoffset="120" transform="rotate(-90 75 75)"/></svg>
      <span style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 64px">7</span>
    </div>
    <div style="font-size: 13px; color: #E4C9CE">Continues left: <b style="color: #FFFFFF">2</b></div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 56px; display: flex; justify-content: center; gap: 20px">
    <a class="gb" href="Gameplay.dc.html" style="display: flex; align-items: center; justify-content: center; width: 300px; height: 58px; background: #FF3EA5; color: #05060F; text-decoration: none; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 17px; letter-spacing: 3px; clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%)">CONTINUE</a>
    <a class="gb" href="Gameplay.dc.html" style="display: flex; align-items: center; justify-content: center; width: 240px; height: 58px; box-sizing: border-box; border: 2px solid #2DE2FF; color: #2DE2FF; text-decoration: none; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 3px">RETRY STAGE</a>
    <a class="gb" href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; width: 240px; height: 58px; box-sizing: border-box; border: 2px solid rgba(169,180,208,.5); color: #D7DEF0; text-decoration: none; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 3px">MAIN MENU</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    let s = 9;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const stars = [];
    for (let i = 0; i < 90; i++) stars.push({ x: Math.round(r() * 1280), y: Math.round(r() * 720), o: (0.15 + r() * 0.5).toFixed(2) });
    return { stars };
  }
}
</script>
</body>
</html>
