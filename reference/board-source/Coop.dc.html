<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    let s = 61;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const far = [];
    for (let i = 0; i < 180; i++) far.push({ x: Math.round(r() * 1280), y: Math.round(r() * 720), o: (0.2 + r() * 0.6).toFixed(2) });
    const streaks = [];
    for (let i = 0; i < 20; i++) streaks.push({ x: Math.round(r() * 1280), y: Math.round(r() * 700), h: Math.round(18 + r() * 40), o: (0.15 + r() * 0.3).toFixed(2) });
    return { far, streaks };
  }
}
</script>
